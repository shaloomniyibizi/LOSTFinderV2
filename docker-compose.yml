# LostFinder: three branches, each with its OWN PostgreSQL database, connected by RabbitMQ,
# and the web app.
#
#   Web app             -> http://localhost:3000
#   Branch A (Campus)   -> http://localhost:8001/docs   database db-a (port 5433)
#   Branch B (Bus Park) -> http://localhost:8002/docs   database db-b (port 5434)
#   Branch C (Airport)  -> http://localhost:8003/docs   database db-c (port 5435)
#   RabbitMQ dashboard  -> http://localhost:15672       (login: RABBITMQ_USER / RABBITMQ_PASSWORD from .env)
#
# PRIVATE VALUES (passwords, secrets, API keys) live in the ".env" file next to this one.
# First time:  copy .env.example to .env and fill it in. Never share or commit .env.
#
# Easiest:          lostfinder start     (Windows: lostfinder.cmd start, macOS/Linux: ./lostfinder.sh start)
# Start:            docker compose up --build
# Stop:             docker compose down
# Wipe all data:    docker compose down -v
# Simulate a crash: docker compose stop branch-b   (then: docker compose start branch-b)
# Optional self-hosted photo store: docker compose --profile seaweedfs up  (and PHOTO_STORAGE=seaweedfs in .env)

x-db: &db
  image: postgres:16
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 120s   # first-time setup can be slow on Windows; failures here don't count

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env first)}

# A branch is "healthy" when its /health endpoint answers (used by: docker compose up --wait)
x-branch-health: &branch-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

x-branch-env: &branch-env
  # --- secrets, all from .env ---
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example to .env first)}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
  CLOUDINARY_URL: ${CLOUDINARY_URL:-}                   # empty = photos in the shared folder
  # --- not secret ---
  PHOTO_STORAGE: ${PHOTO_STORAGE:-}                     # local | cloudinary | seaweedfs (empty = automatic)
  SEAWEEDFS_FILER_URL: http://seaweedfs:8888            # only used with PHOTO_STORAGE=seaweedfs
  PHOTO_DIR: /data/photos                               # the folder shared by the three branches
  PEER_URLS: A=http://branch-a:8000,B=http://branch-b:8000,C=http://branch-c:8000   # to forward claims
  MATCH_THRESHOLD: ${MATCH_THRESHOLD:-60}

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq            # fixed name so stored messages survive restarts
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      # Give RabbitMQ its internal secret ("Erlang cookie") directly, so it never has to read
      # /var/lib/rabbitmq/.erlang.cookie. On some Windows setups that file can't be read
      # ("Error when reading .erlang.cookie: eacces") and RabbitMQ refuses to start.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie ${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in .env}"
    # No volume and no health check on purpose (both need that cookie file).
    # Queued messages still survive "docker compose stop/start"; only "down" clears them.
    ports:
      - "5672:5672"
      - "15672:15672"

  # ---------- OPTIONAL photo store: SeaweedFS (only starts with --profile seaweedfs) ----------
  seaweedfs:
    profiles: ["seaweedfs"]
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/usr/bin/weed"]
    command: ["server", "-dir=/data", "-filer", "-ip=seaweedfs", "-ip.bind=0.0.0.0",
              "-master.volumeSizeLimitMB=100", "-volume.max=20"]
    ports:
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data

  # ---------- databases: one per branch ----------
  db-a:
    <<: *db
    environment: { <<: *db-env, POSTGRES_DB: branch_a }
    ports: ["5433:5432"]
    volumes: [db-a-data:/var/lib/postgresql/data]

  db-b:
    <<: *db
    environment: { <<: *db-env, POSTGRES_DB: branch_b }
    ports: ["5434:5432"]
    volumes: [db-b-data:/var/lib/postgresql/data]

  db-c:
    <<: *db
    environment: { <<: *db-env, POSTGRES_DB: branch_c }
    ports: ["5435:5432"]
    volumes: [db-c-data:/var/lib/postgresql/data]

  # ---------- branches: the SAME code, different settings ----------
  branch-a:
    build: ./backend
    environment:
      <<: *branch-env
      BRANCH_ID: A
      BRANCH_NAME: Campus
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db-a:5432/branch_a
    ports: ["8001:8000"]
    healthcheck: *branch-health
    volumes: [photos-data:/data/photos]
    depends_on:
      db-a: { condition: service_healthy }
      rabbitmq: { condition: service_started }   # branches retry until RabbitMQ is ready

  branch-b:
    build: ./backend
    environment:
      <<: *branch-env
      BRANCH_ID: B
      BRANCH_NAME: Bus Park
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db-b:5432/branch_b
    ports: ["8002:8000"]
    healthcheck: *branch-health
    volumes: [photos-data:/data/photos]
    depends_on:
      db-b: { condition: service_healthy }
      rabbitmq: { condition: service_started }

  branch-c:
    build: ./backend
    environment:
      <<: *branch-env
      BRANCH_ID: C
      BRANCH_NAME: Airport
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db-c:5432/branch_c
    ports: ["8003:8000"]
    healthcheck: *branch-health
    volumes: [photos-data:/data/photos]
    depends_on:
      db-c: { condition: service_healthy }
      rabbitmq: { condition: service_started }

  # The web app (Next.js). The browser talks to the branches directly, through the ports above.
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BRANCH_A_URL: ${WEB_BRANCH_A_URL:-http://localhost:8001}
        NEXT_PUBLIC_BRANCH_B_URL: ${WEB_BRANCH_B_URL:-http://localhost:8002}
        NEXT_PUBLIC_BRANCH_C_URL: ${WEB_BRANCH_C_URL:-http://localhost:8003}
    ports: ["3000:3000"]
    depends_on: [branch-a, branch-b, branch-c]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  photos-data:
  seaweedfs-data:
  db-a-data:
  db-b-data:
  db-c-data:
